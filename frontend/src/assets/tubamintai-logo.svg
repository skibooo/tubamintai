<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="recGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4B3E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF4B3E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF4B3E"/>
      <stop offset="100%" stop-color="#F5B95A"/>
    </linearGradient>
  </defs>

  <!-- Icon mark: REC dot inside a play-forward bracket -->
  <g transform="translate(20,40)">
    <circle cx="60" cy="60" r="58" fill="none" stroke="#2A2C33" stroke-width="2"/>
    <circle cx="60" cy="60" r="34" fill="url(#recGlow)"/>
    <circle cx="60" cy="60" r="16" fill="#FF4B3E"/>
    <!-- small waveform ticks orbiting, signal/audio cue -->
    <rect x="14" y="52" width="4" height="16" rx="2" fill="url(#waveGrad)"/>
    <rect x="24" y="44" width="4" height="32" rx="2" fill="url(#waveGrad)"/>
    <rect x="98" y="40" width="4" height="40" rx="2" fill="url(#waveGrad)" opacity="0.5"/>
    <rect x="108" y="50" width="4" height="20" rx="2" fill="url(#waveGrad)" opacity="0.5"/>
  </g>

  <!-- Wordmark -->
  <text x="168" y="98" font-family="'Space Grotesk', 'Arial', sans-serif" font-size="52" font-weight="700" fill="#EDEDEF" letter-spacing="-1">
    tuba<tspan fill="#FF4B3E">mintai</tspan>
  </text>
  <text x="170" y="126" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13" letter-spacing="3" fill="#5C5F6A">
    AUTOMATED CONTENT STUDIO
  </text>
</svg>
